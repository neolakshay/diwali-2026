name: Deploy GitHub Pages

on:
  push:
    branches: [diwali-2026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test website
        run: npm test

      - name: Prepare public files only
        run: |
          mkdir -p _site/src _site/audio
          cp index.html styles.css _site/
          cp src/*.js _site/src/
          cp audio/lakshmi-aarti.mp3 _site/audio/

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
